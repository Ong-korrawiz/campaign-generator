[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-generator"
version = "0.1.0"
description = "Reproducible data preparation and evaluation for campaign ideation"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
